name: "murmur build"

# Unsigned builds of this fork for macOS (Apple Silicon) and Windows, plus the
# Rust and frontend test suites. The macOS app is signed locally afterwards.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (v<version>) with the in-app update feed (latest.json)"
        type: boolean
        default: false
  push:
    branches: [solomon, overnight-8-nov]

env:
  # Murmur Cloud relay address (cloud/README.md), baked into the app.
  MURMUR_CLOUD_URL: ${{ vars.MURMUR_CLOUD_URL }}

concurrency:
  group: solomon-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26 (Apple Intelligence)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The default Xcode on macos-15 has no FoundationModels SDK, so the
          # app was built with the Apple Intelligence stub and "Turn into a
          # prompt" never reached the model. Pick the newest Xcode 26.
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then
            sudo xcode-select -s "$X/Contents/Developer"
            echo "Using $X"
          else
            echo "::warning::No Xcode 26 on this runner; Apple Intelligence will be built as a stub"
          fi
          xcodebuild -version
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: solomon-test-v1
      - run: bun install
      - name: Frontend checks
        run: |
          bun run lint
          bunx tsc --noEmit
      - name: Rust tests
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: set -o pipefail; cargo test 2>&1 | tail -150

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
      - uses: actions/checkout@v5
      - name: Use Xcode 26 (Apple Intelligence)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The default Xcode on macos-15 has no FoundationModels SDK, so the
          # app was built with the Apple Intelligence stub and "Turn into a
          # prompt" never reached the model. Pick the newest Xcode 26.
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then
            sudo xcode-select -s "$X/Contents/Developer"
            echo "Using $X"
          else
            echo "::warning::No Xcode 26 on this runner; Apple Intelligence will be built as a stub"
          fi
          xcodebuild -version
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: solomon-${{ matrix.target }}-v1
          cache-bin: false
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install spirv-headers:x64-windows
          "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: bun install
      - name: Build
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          bun run tauri build ${{ matrix.args }} \
            --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}'
      - name: Check Apple Intelligence is built in
        if: runner.os == 'macOS'
        run: |
          BIN=src-tauri/target/${{ matrix.target }}/release/bundle/macos/murmur.app/Contents/MacOS/murmur
          if strings "$BIN" | grep -q "SDK requirement not met"; then
            echo "::warning::This build has the Apple Intelligence stub: Turn into a prompt will use the built-in formatter only"
          else
            echo "Apple Intelligence bridge is the real one"
          fi
      # One stable signing identity for every build. macOS remembers the
      # Microphone and Accessibility permissions by the app's code signature;
      # ad-hoc signatures change with every build, so permissions were lost
      # after each update. The certificate lives in repo secrets
      # (MURMUR_SIGNING_P12, base64, and MURMUR_SIGNING_P12_PASSWORD); the
      # bundle id stays com.pais.handy.
      - name: Sign macOS app with the stable Murmur certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MURMUR_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MURMUR_SIGNING_P12_PASSWORD }}
        run: |
          APP=src-tauri/target/${{ matrix.target }}/release/bundle/macos/murmur.app
          if [ -z "$P12" ]; then
            echo "::warning::No MURMUR_SIGNING_P12 secret: app stays ad-hoc signed, macOS will ask for permissions again"
            exit 0
          fi
          KC="$RUNNER_TEMP/murmur-signing.keychain-db"
          KCPW=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/murmur.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/murmur.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null 2>&1 \
            || echo "::warning::set-key-partition-list failed; codesign may still work"
          rm -f "$RUNNER_TEMP/murmur.p12"
          ID=$(security find-identity -p codesigning "$KC" | awk '/Murmur Code Signing/ {print $2; exit}')
          [ -n "$ID" ] || { echo "::error::Signing identity not found in keychain"; exit 1; }
          codesign --force --deep --options runtime \
            --entitlements src-tauri/Entitlements.plist --keychain "$KC" --sign "$ID" "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d -r- "$APP" 2>&1 | tail -1
          security delete-keychain "$KC"
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          ditto -c -k --keepParent murmur.app murmur-macos-arm64.zip
      # In-app updates: a signed murmur.app.tar.gz + .sig + latest.json in the
      # same format as scripts/release-mac.sh. The updater swaps only the .app,
      # so settings, login and models (~/Library/Application Support/com.pais.handy
      # and the Hugging Face cache) are kept. Needs the TAURI_SIGNING_PRIVATE_KEY
      # secret (the key whose public half is in tauri.conf.json).
      - name: Updater bundle (macOS)
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: no in-app update bundle for this build"
            exit 0
          fi
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUT="$PWD/updater"; mkdir -p "$OUT"
          tar -czf "$OUT/murmur.app.tar.gz" -C src-tauri/target/${{ matrix.target }}/release/bundle/macos murmur.app
          bunx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$OUT/murmur.app.tar.gz" >/dev/null
          node - "$VER" "$OUT" <<'JS'
          const fs = require("fs");
          const [ver, out] = process.argv.slice(2);
          const sig = fs.readFileSync(`${out}/murmur.app.tar.gz.sig`, "utf8").trim();
          const url = `https://github.com/Solomon-69/murmur/releases/download/v${ver}/murmur.app.tar.gz`;
          fs.writeFileSync(`${out}/latest.json`, JSON.stringify({
            version: ver, notes: `murmur ${ver}`,
            pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
            platforms: { "darwin-aarch64": { signature: sig, url } },
          }, null, 2));
          JS
          ls -la "$OUT"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: murmur-updater
          path: updater
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: murmur-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  # Opt-in: publish the macOS build as release v<version>, so installed
  # copies update in place from releases/latest/download/latest.json.
  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: murmur-updater
          path: updater
      - uses: actions/download-artifact@v7
        with:
          name: murmur-aarch64-apple-darwin
          path: mac
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f updater/latest.json || { echo "::error::No update bundle (TAURI_SIGNING_PRIVATE_KEY secret missing?)"; exit 1; }
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ZIP=$(find mac -name 'murmur-macos-arm64.zip' | head -1)
          cp "$ZIP" murmur-mac.zip
          (cd updater && sha256sum murmur.app.tar.gz) > SHA256SUMS.txt
          sha256sum murmur-mac.zip >> SHA256SUMS.txt
          gh release create "v$VER" --target "$GITHUB_SHA" --title "murmur $VER" --notes "murmur $VER" \
            murmur-mac.zip updater/murmur.app.tar.gz updater/murmur.app.tar.gz.sig updater/latest.json SHA256SUMS.txt

  # Installs the Windows build on a clean Windows runner and takes screenshots
  # of the first-run screen, the settings window and the recording bar.
  windows-screens:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: murmur-x86_64-pc-windows-msvc
          path: dist
      - name: Install, launch and screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "saved $name ($($b.Width)x$($b.Height))"
          }
          $setup = Get-ChildItem -Recurse dist -Filter *.exe | Select-Object -First 1
          Write-Host "installer: $($setup.FullName)"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem -Recurse "$env:LOCALAPPDATA", "$env:ProgramFiles" -Filter murmur.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "murmur.exe not installed" }
          Write-Host "app: $($app.FullName)"
          # First run: onboarding.
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 25
          Shot "1-first-run"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process murmur -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          # Second run with onboarding done: the settings window.
          $dir = Join-Path $env:APPDATA "com.pais.handy"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $store = Join-Path $dir "settings_store.json"
          if (Test-Path $store) {
            $json = Get-Content $store -Raw | ConvertFrom-Json
            $json.settings.onboarding_completed = $true
            $json | ConvertTo-Json -Depth 32 | Set-Content $store -Encoding utf8
          } else {
            '{"settings":{"onboarding_completed":true}}' | Set-Content $store -Encoding utf8
          }
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 20
          Shot "2-settings"
          Start-Process $app.FullName -ArgumentList '--preview-overlay'
          Start-Sleep -Seconds 3
          Shot "3-recording-bar"
          Start-Process $app.FullName -ArgumentList '--preview-prompt-chip'
          Start-Sleep -Seconds 2
          Shot "4-prompt-choice"
          Get-Process murmur -ErrorAction SilentlyContinue | Stop-Process -Force
          $logs = Get-ChildItem -Recurse "$env:LOCALAPPDATA\com.pais.handy", "$env:APPDATA\com.pais.handy" -Filter *.log -ErrorAction SilentlyContinue
          foreach ($l in $logs) { Copy-Item $l.FullName shots/ }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screens
          path: shots
          retention-days: 14
